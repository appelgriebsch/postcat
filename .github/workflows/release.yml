name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs only package and verify — they never publish.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo test --locked

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: "!contains(matrix.target, 'windows')"
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          version=${VERSION#v}
          mkdir package
          cp "target/$TARGET/release/postcat" package/postcat
          tar -C package -czf "postcat-${version}-${TARGET}.tar.gz" postcat

      - name: Package binary (Windows)
        if: contains(matrix.target, 'windows')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          version=${VERSION#v}
          mkdir package
          cp "target/$TARGET/release/postcat.exe" package/postcat.exe
          cd package && 7z a "../postcat-${version}-${TARGET}.zip" postcat.exe

      - uses: actions/upload-artifact@v4
        with:
          name: postcat-${{ matrix.target }}
          path: |
            postcat-*.tar.gz
            postcat-*.zip

  publish:
    name: Publish release
    needs: build-binaries
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "releasing postcat $crate"

      - name: Package
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish --locked --dry-run

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Download binary artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: postcat-*
          merge-multiple: true

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh api repos/egoist/homebrew-tap/dispatches \
            --method POST \
            --field event_type=postcat-release \
            --field "client_payload[version]=${VERSION#v}"
