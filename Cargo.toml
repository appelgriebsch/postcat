[package]
name = "postcat"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "A modern, keyboard-first API client in your terminal"
license = "MIT"
repository = "https://github.com/egoist/postcat"
homepage = "https://github.com/egoist/postcat"
readme = "README.md"
keywords = ["tui", "http", "api", "client", "postman"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tui-textarea = "0.7"

[profile.release]
lto = "thin"
strip = true
